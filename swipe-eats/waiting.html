<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Swipe Eats – Várakozás</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">

    <div class="waiting-header">
      <div class="waiting-icon">⏳</div>
      <h1 class="waiting-title">Várakozás...</h1>
      <p class="waiting-sub">Barátaid még swipelnek</p>
      <div class="wait-count" id="waitCount">Betöltés...</div>
    </div>

    <div class="wait-list" id="waitList">
      <!-- Rendered by JS -->
    </div>

    <div class="waiting-actions">
      <p style="text-align:center;color:var(--text-muted);font-size:13px;padding:0 20px">
        Ha mindenki kész, az eredmények automatikusan megjelennek.
      </p>
      <button class="btn btn-secondary" id="forceStart">⏭ Eredmények megtekintése most</button>
      <a class="btn btn-secondary" href="index.html" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center">🏠 Mégsem</a>
    </div>

  </div>

  <script src="js/restaurants.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
